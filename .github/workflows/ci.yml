name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Gate
        shell: pwsh
        env:
          # The end-to-end tests start a PowerShell session each. Load from parallel ConPTY
          # sessions made the first report (3 s, v0.2.0 release run) or the first command
          # (15 s quiet_session wait, earlier CI) overrun its timeout.
          RUST_TEST_THREADS: 2
        run: ./.claude/skills/shell-panel-review/scripts/verify.ps1

  installer:
    name: Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release binary
        run: cargo build --release --locked
      - name: Installer under PowerShell 7
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Shell pwsh
      - name: Installer under Windows PowerShell 5.1
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Shell powershell
