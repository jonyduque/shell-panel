[package]
name = "shell-panel"
version = "0.1.0"
edition = "2021"
description = "IDE-style command line auto-complete panel for Windows PowerShell"
authors = ["jonyd"]
license = "MIT"

[dependencies]
portable-pty = "0.8"
crossterm = { version = "0.28", features = ["windows", "event-stream"] }
futures-util = "0.3"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.15"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
